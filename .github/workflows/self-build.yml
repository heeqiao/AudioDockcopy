# 自用云端编译：不依赖原作者的任何 secrets（MinIO / Docker Hub / Harbor / Apple 证书）
# 用法：GitHub 仓库 -> Actions -> Self Build (AudioDock) -> Run workflow，选择构建目标。
# 注意：原仓库自带的 6 个 workflow 是作者发布流水线，fork 后建议先移走，见下方说明。
#
# 建议：把本仓库设为 Private（个人非商业自用），不要公开发布去除会员限制的安装包。
name: Self Build (AudioDock)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "构建目标"
        required: true
        default: "windows"
        type: choice
        options:
          - web       # 仅静态 Web，最便宜，顺带用 tsc -b 校验全部类型改动
          - windows   # Windows x64 安装包 (NSIS .exe)
          - android   # Android APK (armeabi-v7a + arm64-v8a，debug 签名的 release 包)
          - docker    # NAS 用 Docker 镜像
          - all       # 以上四项全部构建（耗时最长）
      push_image:
        description: "docker: 是否推送镜像到 GHCR（关闭则只构建、不推送）"
        type: boolean
        default: true
      docker_platforms:
        description: "docker: 目标平台（NAS 一般是 amd64；arm64 需 QEMU 模拟，会慢很多）"
        type: choice
        default: "linux/amd64"
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1) 静态 Web：ubuntu 计费 1x，几分钟完成，用来先验证 TypeScript 改动
  # ------------------------------------------------------------------
  web:
    if: ${{ inputs.target == 'web' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm 10.28.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: file:./dev.db

      - name: Build workspace packages
        shell: bash
        run: |
          set -e
          pnpm --filter @soundx/ws run build
          pnpm --filter @soundx/i18e run build
          pnpm --filter @soundx/utils run build
          pnpm --filter @soundx/db run generate
          pnpm --filter @soundx/db run build
          pnpm --filter @soundx/services run build
        env:
          DATABASE_URL: file:./dev.db

      - name: Build desktop web (tsc -b + vite build)
        run: pnpm --filter sound-x run build:web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: AudioDock-Web
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------
  # 2) Windows 桌面安装包：windows-latest 自带 Rust / MSVC / WebView2
  # ------------------------------------------------------------------
  windows:
    if: ${{ inputs.target == 'windows' || inputs.target == 'all' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm 10.28.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: file:./dev.db

      - name: Build workspace packages
        shell: bash
        run: |
          set -e
          pnpm --filter @soundx/ws run build
          pnpm --filter @soundx/i18e run build
          pnpm --filter @soundx/utils run build
          pnpm --filter @soundx/db run generate
          pnpm --filter @soundx/db run build
          pnpm --filter @soundx/services run build
        env:
          DATABASE_URL: file:./dev.db

      - name: Build Tauri Windows installer
        # build:win = "cross-env VITE_PLATFORM=win tsc -b && vite build && tauri build ..."
        # cross-env 只作用于第一条命令，这里在 step 级别补齐 VITE_PLATFORM，
        # 保证 tauri.conf.json 的 beforeBuildCommand (pnpm build) 也拿到同一平台值。
        shell: bash
        env:
          VITE_PLATFORM: win
        run: pnpm --filter sound-x run build:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AudioDock-Windows-x64
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # 3) Android APK：ubuntu-latest 自带 Android SDK，无需任何私有 secrets。
  #    沿用原作者 android-release.yml 里已验证过的几个坑：
  #      - 不要用 android-actions/setup-android@v3，它会强装已下线的 'tools' 包，
  #        在 ubuntu-24.04 上必然失败（Failed to find package 'tools'）。
  #      - RN 0.81 要求 ndkVersion=27.1.12297006，必须用 sdkmanager 预装并带重试；
  #        交给 gradle 自动下载时 zip 损坏会报 "Error on ZipFile unknown archive"。
  #      - app.json 声明了 res/xml/network_security_config.xml，文件需存在于原生工程。
  #      - react-native-track-player 5.0.0-alpha0 的 MusicModule.kt 有 Kotlin 空安全
  #        编译错误，需要把可空 Bundle 加 ?: Bundle()。
  #    release 变体使用仓库自带的 android/app/debug.keystore 签名，
  #    产物可直接安装到手机/车机，但不能上架，也不能覆盖安装官方同包名版本。
  # ------------------------------------------------------------------
  android:
    if: ${{ inputs.target == 'android' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head
          sdkmanager --version || true

      - name: Install NDK 27.1.12297006
        shell: bash
        run: |
          set -e
          if [ -d "$ANDROID_HOME/ndk/27.1.12297006" ]; then
            echo "NDK 27.1.12297006 already installed"
            exit 0
          fi
          # sdkmanager 不在 PATH：ubuntu 镜像里位于 cmdline-tools/<版本>/bin/ 下
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -z "$SDKMANAGER" ] && SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          echo "Using SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for i in 1 2 3; do
            "$SDKMANAGER" "ndk;27.1.12297006" && break
            echo "NDK install attempt $i failed, cleaning up and retrying..."
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006" || true
            sleep 10
          done
          ls "$ANDROID_HOME/ndk/27.1.12297006" > /dev/null

      - name: Setup pnpm 10.28.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch react-native-track-player (Kotlin null-safety)
        shell: bash
        run: |
          set -e
          # -print -quit 避免 find | head 在 pipefail 下被 SIGPIPE 判为失败
          FILE=$(find node_modules -name MusicModule.kt -path '*react-native-track-player*' -print -quit)
          if [ -n "$FILE" ]; then
            echo "Patching $FILE"
            sed -i 's/metadata.putBundle(Metas.METADATA_KEY_EXTRAS, bundle)/metadata.putBundle(Metas.METADATA_KEY_EXTRAS, bundle ?: Bundle())/g' "$FILE"
            sed -i 's/intent.putExtras(bundle)/intent.putExtras(bundle ?: Bundle())/g' "$FILE"
            # 只做提示，不因目标行不存在而让步骤失败（上游版本可能已自行修复）
            grep -n "METADATA_KEY_EXTRAS\|putExtras" "$FILE" || echo "  (target lines not present in this version, patch is a no-op)"
          else
            echo "::warning::MusicModule.kt not found, skipping patch"
          fi

      - name: Build workspace packages
        shell: bash
        run: |
          set -e
          pnpm --filter @soundx/ws run build
          pnpm --filter @soundx/i18e run build
          pnpm --filter @soundx/utils run build
          pnpm --filter @soundx/db run generate
          pnpm --filter @soundx/db run build
          pnpm --filter @soundx/services run build

      - name: Ensure network security config
        shell: bash
        run: |
          set -e
          DEST=apps/mobile/android/app/src/main/res/xml
          mkdir -p "$DEST"
          if [ ! -f "$DEST/network_security_config.xml" ]; then
            cp apps/mobile/network_security_config.xml "$DEST/"
          fi
          ls -la "$DEST/network_security_config.xml"
          grep -n "networkSecurityConfig" apps/mobile/android/app/src/main/AndroidManifest.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android release APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          DIR=apps/mobile/android/app/build/outputs/apk/release
          ls -lh "$DIR"
          if [ -f "$DIR/app-release.apk" ]; then
            SRC="$DIR/app-release.apk"
          else
            # 若将来开启了 ABI splits，退而取第一个 release APK
            SRC=$(find "$DIR" -maxdepth 1 -name '*.apk' -print -quit)
          fi
          test -n "$SRC" && test -f "$SRC"
          NAME="AudioDock-${VERSION}-android.apk"
          OUT="$DIR/$NAME"
          mv "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioDock-Android
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # 4) NAS / Docker 镜像：只用 GITHUB_TOKEN 推到自己的 GHCR
  # ------------------------------------------------------------------
  docker:
    if: ${{ inputs.target == 'docker' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Normalize image name for GHCR
        id: image
        shell: bash
        run: |
          # Docker reference 的每一段必须以字母或数字结尾。本仓库名是 "AudioDock-"，
          # 只做小写转换会得到 ghcr.io/heeqiao/audiodock-:latest，
          # 从而报 "invalid reference format"。这里去掉首尾的 - . _ 分隔符。
          norm() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-._]+//; s/[-._]+$//'
          }
          FULL='${{ github.repository }}'
          OWNER=$(norm "${FULL%%/*}")
          REPO=$(norm "${FULL#*/}")
          [ -n "$OWNER" ] || OWNER='${{ github.repository_owner }}'
          [ -n "$REPO" ] || REPO=audiodock
          echo "name=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "GHCR image: ghcr.io/${OWNER}/${REPO}"

      - name: Login to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and optionally push) image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # 不推送时强制单平台并 load 到本地；多平台 + load 不兼容。
          platforms: ${{ (inputs.push_image && inputs.docker_platforms) || 'linux/amd64' }}
          push: ${{ inputs.push_image }}
          load: ${{ !inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
